
<style>
  .container { padding: 1.5rem 0; font-family: var(--font-sans); }
  .tab-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .tab { padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-secondary); transition: all 0.15s; }
  .tab.active { background: var(--color-background-info); color: var(--color-text-info); border-color: transparent; font-weight: 500; }
  .card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.5rem; margin-bottom: 1rem; }
  .hook-name { font-size: 18px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
  .hook-tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--color-background-secondary); color: var(--color-text-secondary); margin-bottom: 12px; }
  .definition { font-size: 14px; line-height: 1.7; color: var(--color-text-primary); margin-bottom: 12px; }
  .syntax { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 14px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-primary); margin-bottom: 14px; overflow-x: auto; }
  .use-when { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 12px; }
  .use-when strong { color: var(--color-text-primary); font-weight: 500; }
  .q-section { margin-top: 14px; border-top: 0.5px solid var(--color-border-tertiary); padding-top: 14px; }
  .q-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-tertiary); margin-bottom: 8px; font-weight: 500; }
  .q-item { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 14px; margin-bottom: 8px; cursor: pointer; }
  .q-item:hover { border: 0.5px solid var(--color-border-secondary); }
  .q-text { font-size: 13px; color: var(--color-text-primary); }
  .a-text { font-size: 13px; color: var(--color-text-secondary); line-height: 1.6; margin-top: 8px; display: none; border-top: 0.5px solid var(--color-border-tertiary); padding-top: 8px; }
  .a-text.open { display: block; }
  .toggle-hint { font-size: 11px; color: var(--color-text-tertiary); float: right; }
  .search-row { margin-bottom: 1rem; }
  .search-row input { width: 100%; padding: 8px 12px; font-size: 14px; border-radius: var(--border-radius-md); }
  .count-badge { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: 1rem; }
  .no-results { text-align: center; padding: 2rem; color: var(--color-text-tertiary); font-size: 14px; }
</style>

<div class="container">
  <h2 class="sr-only">React Hooks Interview Prep — definitions and cross questions</h2>

  <div class="tab-row" id="tabs"></div>
  <div class="search-row">
    <input type="text" id="search" placeholder="Search hooks or questions…" oninput="filterCards()" />
  </div>
  <div class="count-badge" id="count"></div>
  <div id="cards"></div>
</div>

<script>
const hooks = [
  {
    name: "useState",
    tag: "State",
    definition: "Returns a stateful value and a setter. State is stored on the fiber node; calling the setter enqueues an update and triggers a re-render.",
    syntax: "const [state, setState] = useState(initialValue)",
    useWhen: "Simple, independent values — toggles, counters, form fields.",
    questions: [
      { q: "What is a stale closure in useState?", a: "Using state directly inside setTimeout captures the value at render time. Use the functional updater setState(prev => ...) to always read the latest value." },
      { q: "Does setState({...obj}) always trigger a re-render even if values are the same?", a: "Yes — a new object reference is created, so Object.is returns false and React re-renders. To skip, keep the same reference or use useReducer with a comparison." },
      { q: "When is the lazy initializer (setState(() => ...)) useful?", a: "When the initial value is expensive to compute (e.g. reading from localStorage). The function runs only once on mount, not on every render." },
      { q: "How does React 18 batching differ from React 17?", a: "React 18 batches state updates everywhere — inside promises, setTimeout, and native events. React 17 only batched inside React event handlers." }
    ]
  },
  {
    name: "useEffect",
    tag: "Side Effects",
    definition: "Synchronizes a component with an external system (API calls, subscriptions, timers). Runs after paint — non-blocking for the browser.",
    syntax: "useEffect(() => { return cleanup }, [deps])",
    useWhen: "Data fetching, event subscriptions, DOM side effects that don't need to block paint.",
    questions: [
      { q: "Why is useEffect NOT the same as componentDidMount?", a: "useEffect fires after paint, not before. componentDidMount fires synchronously after DOM insertion. For layout-critical work, use useLayoutEffect." },
      { q: "What is the Strict Mode double-invocation and why does React do it?", a: "React 18 mounts → unmounts → remounts in dev to surface missing cleanups. Your effect must be resilient to this — always return a cleanup function." },
      { q: "Why do object/array dependencies cause infinite loops?", a: "A new object literal creates a new reference on every render. Object.is comparison returns false each time, so the effect keeps firing. Destructure primitives or memoize the object." },
      { q: "How do you prevent race conditions in data fetching with useEffect?", a: "Use a cancelled flag or AbortController. In the cleanup function set cancelled = true / call controller.abort() so stale responses don't update state." }
    ]
  },
  {
    name: "useLayoutEffect",
    tag: "DOM / Layout",
    definition: "Same API as useEffect but fires synchronously after DOM mutations and before the browser paints. Use for layout measurements that must be correct on the first frame.",
    syntax: "useLayoutEffect(() => { return cleanup }, [deps])",
    useWhen: "Measuring DOM size/position, preventing flicker, syncing with animations based on layout.",
    questions: [
      { q: "When would you choose useLayoutEffect over useEffect?", a: "When you need to read or mutate the DOM before the user sees the frame — e.g. positioning a tooltip or measuring an element's width to set another element's size." },
      { q: "What is the danger of heavy computation inside useLayoutEffect?", a: "It blocks painting. Every millisecond spent there is visible jank to the user." },
      { q: "Why does useLayoutEffect warn on SSR?", a: "There is no DOM on the server, so it can't run meaningfully. Use useEffect or a conditional check (typeof window !== 'undefined') for SSR-safe code." }
    ]
  },
  {
    name: "useMemo",
    tag: "Performance",
    definition: "Caches the result of an expensive computation. React recomputes only when dependencies change. Primary use: referential stability for objects/arrays passed to memoized children.",
    syntax: "const value = useMemo(() => compute(a, b), [a, b])",
    useWhen: "Expensive calculations; keeping object/array references stable to prevent child re-renders.",
    questions: [
      { q: "Is useMemo a guarantee that the value won't be recomputed?", a: "No. React may discard cached values under memory pressure. Your code must be correct without it — useMemo is a performance hint only." },
      { q: "What comparison does React use for useMemo dependencies?", a: "Object.is — same as === except Object.is(NaN, NaN) is true and Object.is(+0, -0) is false." },
      { q: "How is useMemo related to useCallback?", a: "useCallback(fn, deps) is equivalent to useMemo(() => fn, deps). useCallback memoizes a function; useMemo memoizes a computed value." },
      { q: "Will the React Compiler (React 19+) make useMemo obsolete?", a: "Potentially yes for many cases — it auto-memoizes. But manual useMemo may still be useful for complex or library-level optimizations." }
    ]
  },
  {
    name: "useCallback",
    tag: "Performance",
    definition: "Memoizes a function reference. Returns the same function between renders unless dependencies change. Prevents unnecessary re-renders of memoized child components.",
    syntax: "const fn = useCallback(() => { ... }, [deps])",
    useWhen: "Passing callbacks to React.memo children; stable function references for useEffect deps.",
    questions: [
      { q: "When is useCallback not worth using?", a: "When the function isn't passed as a prop to a memoized child, or when the component tree is small. The overhead of memoization can exceed the savings." },
      { q: "What's the difference between useCallback and useMemo?", a: "useCallback memoizes a function. useMemo memoizes a computed value. useCallback(fn, deps) === useMemo(() => fn, deps)." },
      { q: "Can useCallback prevent stale closures?", a: "No — it can cause them. If you omit a dependency, the callback captures a stale value. Always include all values the callback reads." }
    ]
  },
  {
    name: "useRef",
    tag: "DOM / Instance",
    definition: "Returns { current: value } that persists for the component's lifetime. Mutating .current does not trigger a re-render. Used for DOM nodes and mutable instance variables.",
    syntax: "const ref = useRef(initialValue)",
    useWhen: "DOM access, storing timers/intervals, previous values, WebSocket instances.",
    questions: [
      { q: "What's the difference between useRef and useState for storing a value?", a: "useRef mutation doesn't cause a re-render. useState mutation does. Use useRef for values that need to persist but shouldn't drive the UI." },
      { q: "What is a callback ref and when would you use it?", a: "A function passed as the ref prop, called when the element mounts/unmounts. Use it when you need to be notified of attachment — e.g. for dynamically rendered lists where useRef won't fire reliably." },
      { q: "Is useRef the equivalent of this.instanceVar in class components?", a: "Yes — it stores mutable values that survive re-renders without triggering them, same as instance properties on a class." }
    ]
  },
  {
    name: "useContext",
    tag: "State Sharing",
    definition: "Reads the nearest matching Context.Provider value above the component in the tree. Solves prop drilling without external libraries.",
    syntax: "const value = useContext(SomeContext)",
    useWhen: "Sharing auth state, theme, locale, or any value needed by many components at different nesting levels.",
    questions: [
      { q: "When should you NOT use useContext?", a: "For frequently changing values (e.g. mouse position) — every consumer re-renders on every change. Use Zustand/Jotai for high-frequency updates, or split contexts." },
      { q: "Why is throwing in a custom hook (if !context) a good practice?", a: "It gives a clear error message instead of a confusing undefined value, making it obvious the component was used outside its Provider." },
      { q: "How do you avoid unnecessary re-renders with useContext?", a: "Split contexts by concern (separate AuthContext, ThemeContext). Memoize the provider value with useMemo. Use useReducer inside the provider for complex state." }
    ]
  },
  {
    name: "useReducer",
    tag: "State",
    definition: "Manages complex state via a pure reducer(state, action) => newState function. Centralizes state transitions. Inspired by Redux.",
    syntax: "const [state, dispatch] = useReducer(reducer, initialState, init?)",
    useWhen: "Multiple related state values, state that depends on previous state, logic that benefits from being testable in isolation.",
    questions: [
      { q: "When would you choose useReducer over useState?", a: "When you have multiple related values that update together, or when next state depends on previous state in complex ways. Reducer logic is also easier to unit-test." },
      { q: "What is the lazy initializer (3rd argument) in useReducer for?", a: "For expensive initial state computation — the init(initialArg) function runs only on mount. Also allows resetting to initial state by dispatching the initialArg to init." },
      { q: "What should you NOT do in a reducer?", a: "Side effects — no API calls, no random values, no Date.now(). Reducers must be pure functions. Side effects belong in event handlers or useEffect." }
    ]
  },
  {
    name: "useTransition",
    tag: "Concurrency",
    definition: "Marks a state update as non-urgent. React can interrupt it if a more urgent update (like typing) arrives. Part of React 18's concurrent rendering model.",
    syntax: "const [isPending, startTransition] = useTransition()",
    useWhen: "Heavy filtering/sorting triggered by user input; navigating between expensive views without blocking the input.",
    questions: [
      { q: "How is useTransition different from debouncing?", a: "Debounce delays execution. startTransition runs immediately at lower priority — React may interrupt and restart it. Debounce is a timer trick; transitions are a rendering priority concept." },
      { q: "Can you pass async code to startTransition?", a: "No — the callback must be synchronous. The state update inside it is what gets marked as a transition." },
      { q: "What does isPending tell you and when should you use it?", a: "It's true while the transition is in progress. Use it to show a loading indicator without hiding the current (stale) content." }
    ]
  },
  {
    name: "useDeferredValue",
    tag: "Concurrency",
    definition: "Returns a deferred copy of a value that lags behind during urgent updates. Tells React: 'this value can be stale for a moment while you handle urgent work.'",
    syntax: "const deferred = useDeferredValue(value)",
    useWhen: "When you receive a frequently-changing prop but can't control the setter — you defer its consumption instead.",
    questions: [
      { q: "What's the key difference between useTransition and useDeferredValue?", a: "useTransition controls the state update itself — you need access to the setter. useDeferredValue works on a received value — useful when you don't own the state." },
      { q: "How can you show staleness visually with useDeferredValue?", a: "Compare query !== deferredQuery. When true, the value is stale — dim the results list with opacity: 0.6 to signal a refresh is coming." }
    ]
  },
  {
    name: "useId",
    tag: "Accessibility",
    definition: "Generates a unique, stable, SSR-safe identifier. Guarantees the same ID on server and client, preventing hydration mismatches.",
    syntax: "const id = useId()",
    useWhen: "Linking <label htmlFor> to inputs; aria-describedby; any case requiring stable unique IDs.",
    questions: [
      { q: "Can you use useId for list keys?", a: "No — useId is for DOM id attributes, not React key props. Keys should come from your data (e.g. item.id)." },
      { q: "Why is Math.random() dangerous for IDs in SSR apps?", a: "Server and client generate different random values, causing a hydration mismatch. useId produces deterministic IDs that match across both." }
    ]
  },
  {
    name: "useSyncExternalStore",
    tag: "External State",
    definition: "Subscribes a component to an external store in a concurrent-safe way. Prevents 'tearing' — different components reading different snapshots of the same store.",
    syntax: "const snap = useSyncExternalStore(subscribe, getSnapshot, getServerSnapshot?)",
    useWhen: "Browser APIs (online status, media queries), third-party stores (Redux, Zustand), any mutable global state.",
    questions: [
      { q: "What is 'tearing' and why does it matter in concurrent React?", a: "In concurrent mode, React can yield between renders. Without useSyncExternalStore, component A and component B could read different values from the same external store in a single pass — 'tearing'. This hook forces synchronous consistent reads." },
      { q: "What happens if getSnapshot returns a new object on every call?", a: "The component re-renders infinitely — React keeps detecting a 'changed' snapshot. getSnapshot must return the same reference if the value hasn't changed." }
    ]
  },
  {
    name: "useImperativeHandle",
    tag: "Escape Hatch",
    definition: "Customizes the instance value exposed via forwardRef. Restricts the ref API surface — parents only get the methods you explicitly expose.",
    syntax: "useImperativeHandle(ref, () => ({ method }), [deps])",
    useWhen: "Complex components like modals or players where a parent needs to call open()/close()/play() imperatively.",
    questions: [
      { q: "What is the principle of least privilege here?", a: "Expose only the minimum API needed — don't leak the raw DOM node. The parent should call open() not reach into dialogRef.current.showModal()." },
      { q: "Is forwardRef still required in React 19?", a: "No — refs can be passed as a regular prop in React 19. useImperativeHandle still works the same way." }
    ]
  },
  {
    name: "use (React 19)",
    tag: "React 19",
    definition: "Reads a Promise or Context value during render. Integrates with Suspense. Unlike hooks, it CAN be called conditionally — it's an API, not a hook.",
    syntax: "const value = use(promiseOrContext)",
    useWhen: "Reading async data in render; conditionally reading a context value.",
    questions: [
      { q: "Why does use() break the rules of hooks intentionally?", a: "It doesn't allocate a slot in the hook linked list. It's a compiler/runtime primitive, not a traditional hook — so conditional and loop usage is safe." },
      { q: "What happens if you pass a new Promise to use() on every render?", a: "The component suspends infinitely. Promises must be cached outside the render path (useMemo, module-level, or a cache library)." },
      { q: "How does use() replace useContext?", a: "use(SomeContext) is the modern replacement for useContext(SomeContext), with the benefit of conditional calling." }
    ]
  },
  {
    name: "useOptimistic (React 19)",
    tag: "React 19",
    definition: "Provides an optimistic copy of a value that updates instantly during an async action, then automatically reverts if the action fails.",
    syntax: "const [optimistic, addOptimistic] = useOptimistic(actual, updateFn)",
    useWhen: "Like/unlike buttons, todo completion, any action where immediate feedback matters more than waiting for the server.",
    questions: [
      { q: "How does automatic rollback work?", a: "When the parent re-renders with the same actual value (indicating the server didn't confirm the change), React reverts the optimistic state automatically." },
      { q: "Does useOptimistic replace try/catch/rollback state patterns?", a: "Yes — it eliminates the manual optimistic → success/failure state management you'd otherwise write with useState." }
    ]
  }
];

let activeCategory = "All";
let openAnswers = new Set();

function getCategories() {
  const cats = ["All", ...new Set(hooks.map(h => h.tag))];
  return cats;
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = getCategories().map(c =>
    `<button class="tab ${c === activeCategory ? 'active' : ''}" onclick="setCategory('${c}')">${c}</button>`
  ).join("");
}

function setCategory(cat) {
  activeCategory = cat;
  openAnswers.clear();
  renderTabs();
  renderCards();
}

function filterCards() {
  openAnswers.clear();
  renderCards();
}

function toggleAnswer(id) {
  if (openAnswers.has(id)) openAnswers.delete(id);
  else openAnswers.add(id);
  const el = document.getElementById("a-" + id);
  if (el) el.classList.toggle("open");
  const hint = document.getElementById("hint-" + id);
  if (hint) hint.textContent = openAnswers.has(id) ? "hide ▲" : "tap to reveal ▼";
}

function renderCards() {
  const query = document.getElementById("search").value.toLowerCase();
  let visible = hooks.filter(h => {
    if (activeCategory !== "All" && h.tag !== activeCategory) return false;
    if (!query) return true;
    return h.name.toLowerCase().includes(query) ||
      h.definition.toLowerCase().includes(query) ||
      h.questions.some(q => q.q.toLowerCase().includes(query) || q.a.toLowerCase().includes(query));
  });

  document.getElementById("count").textContent = visible.length + " hook" + (visible.length !== 1 ? "s" : "");

  if (!visible.length) {
    document.getElementById("cards").innerHTML = `<div class="no-results">No results found</div>`;
    return;
  }

  document.getElementById("cards").innerHTML = visible.map((h, hi) => `
    <div class="card">
      <div class="hook-name">${h.name}</div>
      <span class="hook-tag">${h.tag}</span>
      <div class="definition">${h.definition}</div>
      <div class="syntax">${h.syntax}</div>
      <div class="use-when"><strong>Use when:</strong> ${h.useWhen}</div>
      <div class="q-section">
        <div class="q-label">Interview questions</div>
        ${h.questions.map((q, qi) => {
          const id = hi + "-" + qi;
          const isOpen = openAnswers.has(id);
          return `
            <div class="q-item" onclick="toggleAnswer('${id}')">
              <div class="q-text">
                <span id="hint-${id}" class="toggle-hint">${isOpen ? "hide ▲" : "tap to reveal ▼"}</span>
                Q: ${q.q}
              </div>
              <div class="a-text ${isOpen ? 'open' : ''}" id="a-${id}">
                <strong>A:</strong> ${q.a}
              </div>
            </div>`;
        }).join("")}
      </div>
    </div>
  `).join("");
}

renderTabs();
renderCards();
</script>
